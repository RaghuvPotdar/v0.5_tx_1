; ============================================================================
;  RAVEN TX — Simulator Training Transmitter — Firmware
;  PlatformIO project configuration
;  Target: ESP32-S3-WROOM-1 (N16R8: 16MB flash, 8MB octal PSRAM), native USB
; ============================================================================
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform        = espressif32@6.7.0      ; Arduino-ESP32 2.0.x toolchain (pinned, FW-12)
board           = esp32-s3-devkitc-1     ; proto board; swap to custom board file for production
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; ---- Flash / PSRAM for WROOM-1 N16R8 (quad flash + octal PSRAM) ----
board_build.flash_size      = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions      = default_16MB.csv

; ---- USB: OTG (TinyUSB) mode is REQUIRED for custom HID (Section 9/10) ----
build_flags =
    -D ARDUINO_USB_MODE=0          ; 0 = USB-OTG / TinyUSB (custom HID). 1 = CDC/JTAG (no custom HID)
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; optional debug serial over USB CDC (FW-13)
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    -D RAVEN_DISPLAY_SH1106=1      ; 1 = 1.3" SH1106 (baseline). Set 0 for 0.96" SSD1306.

lib_deps =
    olikraus/U8g2 @ ^2.35.19       ; OLED driver (SH1106 + SSD1306)

; Host-side native tests for pure logic (calibration math) — optional
[env:native-test]
platform = native
test_framework = unity
build_flags = -D RAVEN_NATIVE_TEST
